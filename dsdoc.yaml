# dsdoc configuration. This is the only file you edit by hand.

scope:                          # dsdoc reads only these files
  python: [src/model_code]      # *.py, recursively
  sql: [src/data, src/sql]      # *.sql, recursively

output_dir: docs                # sources/, business_context.md, model_card.md and stake_summary.md go here

context:
  pdf_inputs: []                # PDFs or images with business context (e.g. the lean canvas); dsdoc-convert turns each into <output_dir>/sources/<name>.md
  business_docs: []             # Markdown files with business context (e.g. Confluence exports), read as they are

reflection:                     # how each document is checked before delivery: off | self | reviewer | both
  default: self                 # used by any skill without its own key; self if this block is missing
  stake_summary: self           # self: the writer critiques its own draft; reviewer: a separate agent reviews it (only via /dsdoc)
  business_context: self        # off | self | reviewer | both; reviewer only via /dsdoc
  model_card: self              # off | self | reviewer | both; reviewer only via /dsdoc

model:                          # what the code can't tell. Empty fields become TODO.
  name: ""
  owner: ""
  contact: ""
  main_metric: ""               # the headline metric for the stakeholder summary, a key from metrics below
  metrics:                      # evaluation values, copied as they are. Per brand: nest them under the brand name.
    {}                          # example: ndcg_k_10: 0.82
  evaluated_on: ""              # date of the data extract the model was trained on; the data is then split into train, valid and test, and the metrics above are computed on that split
  limitations: []